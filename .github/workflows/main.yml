name: Test Python Broadcaster

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Website URL'
        required: true
        default: 'https://w2.sportsonlinee.click/channels/hd/hd1.php'
      okru_stream_id:
        description: 'OK.RU Stream Channel ID (e.g., 1, 1.1, s1.2)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install OBS Studio & Virtual Display (Xvfb)
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb pulseaudio

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage

      - name: Start Broadcast (Xvfb + Python)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          OKRU_STREAM_ID: ${{ github.event.inputs.okru_stream_id }}
        run: |
          # Start PulseAudio for sound capture
          pulseaudio -D --exit-idle-time=-1
          
          # Run Python script inside a virtual display
          xvfb-run -s "-screen 0 1920x1080x24" python stream_test.py
